baseURL: "https://outofscope.blog"
languageCode: "en-us"
title: "Out of Scope"
theme: "wilde"
timeZone: Europe/Berlin
summaryLength: 50
pagination:
  pagerSize: 6
  path: "p"
canonifyURLs: false
footnoteReturnLinkContents: "↩"
plainIDAnchors: true
autolink: false
assetDir: "static"
permalinks:
  posts:  /posts/:slug
  notes:  /notes/:2006:01:02:150405
  links:  /:sections/:2006:01:02:150405
  photos: /photos/:2006/:01/:slug
  domains: /links/:slug
taxonomies:
  tag: tags
  type: type
  language: languages
  domain: domains

frontmatter:
  date:
    - "date"
    - "lastmod"
    - "publishDate"
    - ":filename"
  publishDate:
    - "date"
    - "publishDate"
  lastmod:
    - "lastmod"
    - ":fileModTime"
    - "publishDate"

markup:
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      hardWraps: true
      unsafe: true
# if you want markdown WYSIWYG line break
#blackfriday:
#  extensions:
#    - "hardLineBreak"

menu:
  main:
    - {identifier: home,    name: "Home",    url: "/",         weight: 1}
    - {identifier: posts,   name: "Posts",   url: "/posts/",   weight: 2}
    - {identifier: notes,   name: "Notes",   url: "/notes/",   weight: 3}
    - {identifier: links,   name: "Links",   url: "/links/",   weight: 4}
    - {identifier: photos,  name: "Photos",  url: "/photos/",  weight: 5}
    - {identifier: archive, name: "Archive", url: "/archive/", weight: 6}
  footer:
    - {identifier: about, name: "About", url: "/about/", weight: 1}
    - {identifier: rss, name: "RSS", url: "/feeds/", weight: 2}
    - {identifier: tags, name: "Tags", url: "/tags/", weight: 3}
    - {identifier: website, name: "Website", url: "https://friedrich.uk", weight: 4}
    - {identifier: mastodon, name: "Mastodon", url: "https://click.ba.it/@jason", weight: 5}

mediaTypes:
  application/atom+xml:
    suffixes:
      - 'xml'

outputFormats:
  atom:
    baseName: 'index'
    isPlainText: false
    mediaType: 'application/atom+xml'
    rel: 'alternate'

outputs:
  home:
    - HTML
    - Atom
    - JSON
  section:
    - HTML
    - Atom

disableKinds:
  - 'RSS'

params:
  # --- wilde theme: hybrid preset, cool palette ---
  preset: hybrid
  hue: 200          # cyan (primary)
  altHue: 265       # indigo (secondary)
  tagline: "Everything beyond the brief"
  description: "A tech blog by Jason Friedrich — posts, notes, links and the occasional photo."
  feedSections: [posts, links, notes]
  author:
    given_name: "Jason"
    family_name: "Friedrich"
    display_name: "Jason Friedrich"
    website: "https://friedrich.uk"
    fediverse_handle: "@jason@click.ba.it"
  email: "mail@outofscope.blog"
  friendly_url: outofscope.blog

caches:
  images:
    dir: :cacheDir/images

privacy:
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: true
  instagram:
    disable: false
    simple: false
  x:
    disable: false
    enableDNT: true
    simple: false
    disableInlineCSS: true
  vimeo:
    disable: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

ignoreErrors: error-remote-getjson
